[project]
name = "policylens"
version = "0.2.0"
description = "GMC Policy Intelligence & QMS Extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
  "pdfplumber>=0.11.0",
  "pytesseract>=0.3.13",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "pinecone>=5.0.0",
  "neo4j>=5.25.0",
  "openai>=1.54.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "types-Pillow>=10.0.0",
]
embeddings = [
  "sentence-transformers>=3.0.0",
]
camelot = [
  "camelot-py[cv]>=0.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
