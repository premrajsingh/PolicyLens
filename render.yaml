# Free-tier Blueprint: public demo (no login wall). Ephemeral disk.
services:
  - type: web
    name: policylens
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: REQUIRE_BASIC_AUTH
        value: "false"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: VECTOR_STORE
        value: local
      - key: GRAPH_STORE
        value: local
      - key: OCR_ENABLED
        value: "false"
      - key: AUTO_SEED_SAMPLES
        value: "true"
      - key: DATA_DIR
        value: /data
      - key: OUTPUT_DIR
        value: /data/outputs
      - key: DATABASE_URL
        value: sqlite:////data/policylens.db
